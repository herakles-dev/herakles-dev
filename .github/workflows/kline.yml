name: Contribution candlesticks

on:
  schedule:
    - cron: "17 5 * * *"   # daily
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: contribution-kline
  cancel-in-progress: true

jobs:
  kline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Grimnirobser/gitdaq@v1

      - name: Commit chart if changed
        run: |
          if [[ -z "$(git status --porcelain kline/)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kline/
          git commit -m "chore: refresh kline chart"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::push still failing after 3 attempts"
          exit 1
