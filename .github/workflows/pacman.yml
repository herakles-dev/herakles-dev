name: Contribution Pac-Man

on:
  schedule:
    - cron: "27 3 * * *"   # daily, off the hour
  workflow_dispatch:
    inputs:
      games:
        description: 'Comma-separated games (e.g. "pacman" or "pacman,galaga")'
        required: false
        default: 'pacman'
      player_style:
        description: 'Pac-Man navigation style'
        required: false
        default: 'aggressive'
        type: choice
        options: [opportunistic, conservative, aggressive]

permissions:
  contents: write

concurrency:
  group: contribution-pacman
  cancel-in-progress: true

jobs:
  pacman:
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: ${{ inputs.games || 'pacman' }}
          player_style: ${{ inputs.player_style || 'aggressive' }}

      - name: Publish dist/ to the output branch
        run: |
          # Same container-leaves-dist-root-owned quirk as the previous
          # snake action; reclaim ownership before writing .git inside it.
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          git init -q
          git checkout -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: refresh contribution pac-man"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
