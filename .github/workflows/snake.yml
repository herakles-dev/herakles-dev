name: Contribution snake

on:
  schedule:
    - cron: "27 3 * * *"   # daily, off the hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publish dist/ to the output branch
        run: |
          # Platane/snk runs in a container and leaves dist/ owned by root;
          # reclaim it before writing .git inside it as the runner user.
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          git init -q
          git checkout -b output
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: refresh contribution snake"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output:output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
