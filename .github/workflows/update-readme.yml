name: Refresh README

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - scripts/**
      - .github/workflows/update-readme.yml

permissions:
  contents: write

concurrency:
  group: refresh-readme
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fonts are subset and embedded into every SVG (scripts/fontkit.py).
      # Pinned to the versions this was verified with.
      - name: Install font tooling
        run: pip install fonttools==4.60.1 brotli==1.1.0
      - name: Refresh README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_readme.py
      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain README.md assets/)" ]]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "chore: refresh README"
          # A manual push to main can land mid-run; rebase onto it and retry
          # instead of failing outright.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::push still failing after 3 attempts"
          exit 1
