<svg width="640" height="12" viewBox="0 0 640 12" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0" />
      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </linearGradient>
    <filter id="plasma" x="-200%" y="-200%" width="500%" height="500%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.9;1.4;0.9" dur="4s" repeatCount="indefinite" />
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" />
    </filter>
  </defs>
  <circle cx="320.0" cy="6.0" r="3.5" fill="#7C3AED" filter="url(#plasma)" />
  <rect x="0" y="5.25" width="640" height="1.5" fill="url(#fade)" />
</svg>