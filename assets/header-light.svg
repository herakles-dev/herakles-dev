<svg width="640" height="298" viewBox="0 0 640 298" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',ui-monospace,monospace">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#241f3d" opacity="0.045" />
    </pattern>
  </defs>
  <rect x="0.5" y="0.5" width="639" height="297" rx="10" fill="#ffffff" stroke="#ded9f7" />
<circle cx="24" cy="24" r="5" fill="#ded9f7" />
<circle cx="42" cy="24" r="5" fill="#ded9f7" />
<circle cx="60" cy="24" r="5" fill="#ded9f7" />
<text x="320.0" y="28" font-size="12" fill="#6b6690" text-anchor="middle">michael@herakles-dev: ~</text>
<line x1="0" y1="40" x2="640" y2="40" stroke="#ded9f7" />
  <rect x="0" y="41" width="640" height="256" fill="url(#scan)" />
  <text x="24" y="66" font-size="15" opacity="0"><tspan fill="#6b6690">$ </tspan><tspan fill="#7C3AED">whoami</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0280;0.0400;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="92" font-size="15" opacity="0"><tspan fill="#241f3d">michael — telecom by day, AI orchestrator by night</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0630;0.0750;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="144" font-size="15" opacity="0"><tspan fill="#6b6690">$ </tspan><tspan fill="#4ade80">uptime</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1780;0.1900;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="170" font-size="15" opacity="0"><tspan fill="#241f3d">up since mid-2025, no reboots planned</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2130;0.2250;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="222" font-size="15" opacity="0"><tspan fill="#6b6690">$ </tspan><tspan fill="#22D3EE">nc -zv herakles.dev 443</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3280;0.3400;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="248" font-size="15" opacity="0"><tspan fill="#241f3d">Connection succeeded.</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3630;0.3750;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <g opacity="0"><text x="24" y="274" font-size="15" fill="#6b6690">$</text><rect x="40" y="259" width="9" height="15" fill="#4ade80" filter="url(#glow)"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite" /></rect><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8180;0.8300;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></g>
</svg>