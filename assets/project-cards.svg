    <g opacity="0"><text x="30" y="96" font-size="10.5" fill="#8b88b8">NUMA-pinned deploys, 3-4</text><text x="30" y="109" font-size="10.5" fill="#8b88b8">LLMs debating over ZeroMQ.</text><text x="30" y="122" font-size="10.5" fill="#8b88b8">One untested vLLM upgrade</text><text x="30" y="135" font-size="10.5" fill="#8b88b8">burned me — now every bump</text><text x="30" y="148" font-size="10.5" fill="#8b88b8">ships a rollback plan.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="9s" begin="0.0s" repeatCount="indefinite" /></g></g>
