    <g opacity="0"><text x="30" y="468" font-size="10.5" fill="#8b88b8">Spatial pathfinding and</text><text x="30" y="481" font-size="10.5" fill="#8b88b8">loss-budget calculations for</text><text x="30" y="494" font-size="10.5" fill="#8b88b8">real fiber builds. Ten years</text><text x="30" y="507" font-size="10.5" fill="#8b88b8">of telecom work, encoded.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="9s" begin="5.4s" repeatCount="indefinite" /></g></g>
