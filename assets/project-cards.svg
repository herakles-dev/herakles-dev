    <g opacity="0"><text x="446" y="282" font-size="10.5" fill="#8b88b8">A Raspberry Pi node running</text><text x="446" y="295" font-size="10.5" fill="#8b88b8">24/7 for an emergency that's</text><text x="446" y="308" font-size="10.5" fill="#8b88b8">never come. Nobody assigned</text><text x="446" y="321" font-size="10.5" fill="#8b88b8">this one.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="9s" begin="4.5s" repeatCount="indefinite" /></g></g>
