    <g opacity="0"><text x="446" y="96" font-size="10.5" fill="#8b88b8">Task-as-truth state, write-</text><text x="446" y="109" font-size="10.5" fill="#8b88b8">gate hooks, adversarial</text><text x="446" y="122" font-size="10.5" fill="#8b88b8">review pairing. Built to</text><text x="446" y="135" font-size="10.5" fill="#8b88b8">survive being rebuilt on</text><text x="446" y="148" font-size="10.5" fill="#8b88b8">itself.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="9s" begin="1.8s" repeatCount="indefinite" /></g></g>
