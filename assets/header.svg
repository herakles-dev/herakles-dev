<rect x="8" y="0" width="624" height="1.5" fill="url(#edge)"/>
<path d="M18,19 C30,14 42,24 60,19" fill="none" stroke="url(#edge)" stroke-width="1.1" opacity="0.45"/>
<path d="M18,24 C30,19 42,29 60,24" fill="none" stroke="url(#edge)" stroke-width="1.1" opacity="0.9"/>
