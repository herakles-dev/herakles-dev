<path d="M18,24 C30,19 42,29 60,24" fill="none" stroke="#DEAF56" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="0.1 46"><animate attributeName="stroke-dashoffset" values="0;-46.1" dur="1.8s" repeatCount="indefinite"/></path>
<text x="320.0" y="28" font-size="12" fill="#9a9aa5" text-anchor="middle">michael@herakles-dev: ~</text>
<line x1="0" y1="40" x2="640" y2="40" stroke="#3a3a42"/>
  <rect x="0" y="41" width="640" height="256" fill="url(#scan)" />
  <text x="24" y="66" font-size="15" opacity="0"><tspan fill="#9a9aa5">$ </tspan><tspan fill="#8E74F2">whoami</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0280;0.0400;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="92" font-size="15" opacity="0"><tspan fill="#e4e4e7">michael — telecom by day, AI orchestrator by night</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0630;0.0750;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="144" font-size="15" opacity="0"><tspan fill="#9a9aa5">$ </tspan><tspan fill="#6FD08C">uptime</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.1780;0.1900;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="170" font-size="15" opacity="0"><tspan fill="#e4e4e7">up since mid-2025, no reboots planned</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2130;0.2250;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="222" font-size="15" opacity="0"><tspan fill="#9a9aa5">$ </tspan><tspan fill="#45C2B8">nc -zv herakles.dev 443</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3280;0.3400;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <text x="24" y="248" font-size="15" opacity="0"><tspan fill="#e4e4e7">Connection succeeded.</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3630;0.3750;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></text>
  <g opacity="0"><text x="24" y="274" font-size="15" fill="#9a9aa5">$</text><rect x="40" y="259" width="9" height="15" fill="#6FD08C" filter="url(#glow)"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.5;0.9;1" dur="1.2s" repeatCount="indefinite" /></rect><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8180;0.8300;0.8600;0.9500;1.0000" dur="10.0s" repeatCount="indefinite" /></g>
