<svg width="640" height="298" viewBox="0 0 640 298" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono',ui-monospace,monospace"><style>@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}</style>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#e4e4e7" opacity="0.045" />
    </pattern>
  </defs>
  <defs><linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#E8CF86" stop-opacity="0"/><stop offset="0.2" stop-color="#E8CF86"/><stop offset="0.8" stop-color="#DEAF56"/><stop offset="1" stop-color="#DEAF56" stop-opacity="0"/></linearGradient><radialGradient id="sheen" cx="0.15" cy="0" r="0.9"><stop offset="0" stop-color="#E8CF86" stop-opacity="0.10"/><stop offset="1" stop-color="#E8CF86" stop-opacity="0"/></radialGradient></defs>
<rect x="0.5" y="0.5" width="639" height="297" rx="8" fill="#17171b" stroke="#3a3a42"/>
